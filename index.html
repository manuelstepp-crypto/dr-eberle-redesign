<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8431f" />
  <title>KPT · Kulinarisches Projektteam</title>
  <meta name="description" content="Die App des Kulinarischen Projektteams – Termine, Rezepte, Bewertungen & mehr." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <!-- Lade-Overlay -->
  <div id="splash" class="splash">
    <div class="splash-logo">🍲</div>
    <div class="splash-name">KPT</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- Identitätsauswahl -->
  <div id="identity" class="identity hidden">
    <div class="identity-card">
      <div class="identity-logo">🍲</div>
      <h1>Kulinarisches Projektteam</h1>
      <p class="identity-sub">Wer bist du?</p>
      <div id="identityList" class="identity-list"></div>
      <div class="identity-add">
        <input id="newMemberName" type="text" placeholder="Neues Mitglied hinzufügen…" maxlength="40" />
        <button id="addMemberBtn" class="btn btn-primary">+</button>
      </div>
    </div>
  </div>

  <!-- App-Shell -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">🍲</span>
        <span class="brand-text">KPT</span>
      </div>
      <button id="profileBtn" class="topbar-profile" title="Profil">
        <span id="topbarAvatar" class="avatar avatar-sm"></span>
      </button>
    </header>

    <main id="view" class="view"><!-- views render here --></main>

    <nav class="tabbar">
      <button class="tab" data-view="termine"><span class="tab-ico">📅</span><span>Termine</span></button>
      <button class="tab" data-view="rezepte"><span class="tab-ico">🍲</span><span>Rezepte</span></button>
      <button class="tab" data-view="ranking"><span class="tab-ico">⭐</span><span>Ranking</span></button>
      <button class="tab" data-view="chat"><span class="tab-ico">💬</span><span>Chat</span></button>
    </nav>
  </div>

  <!-- Modal-Container -->
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <!-- Supabase-Bibliothek lokal mitgeliefert (kein CDN nötig) -->
  <script src="vendor/supabase.js?v=3"></script>
  <script>
    // Fallback auf CDN, falls die lokale Datei fehlt.
    if (!window.supabase) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');
    }
  </script>
  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
